name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish on GitHub Releases (otherwise only build signed test APK)'
        type: boolean
        required: true
        default: false
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MEOWMEOW_SIGNING_KEYSTORE_PATH: /tmp/meowmeow-release-key.jks
      MEOWMEOW_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MEOWMEOW_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      MEOWMEOW_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$GITHUB_REF" == refs/heads/* && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual release builds must run on main."
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Release commit is not on main."
            exit 1
          }
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*$/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected numeric versionName."
            exit 1
          }
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag does not match Android versionName."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$MEOWMEOW_SIGNING_STORE_PASSWORD" ||
                -z "$MEOWMEOW_SIGNING_KEY_ALIAS" || -z "$MEOWMEOW_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets missing; see docs/SIGNED_RELEASES.md."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$MEOWMEOW_SIGNING_KEYSTORE_PATH"
          test -s "$MEOWMEOW_SIGNING_KEYSTORE_PATH"
      - name: Unit tests and signed APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signed APK and prepare asset
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          mkdir -p dist
          FILE="MeowMeowFileManager-$RELEASE_TAG.apk"
          cp "$APK" "dist/$FILE"
          (cd dist && sha256sum "$FILE" > SHA256SUMS.txt)
      - name: Remove keystore from CI runner
        if: always()
        run: rm -f "$MEOWMEOW_SIGNING_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-meowmeow-${{ steps.version.outputs.tag }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish == true
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists. Bump Android version before publishing again."
            exit 1
          fi
          NOTES="docs/releases/$RELEASE_TAG.md"
          if [[ -f "$NOTES" ]]; then
            cp "$NOTES" dist/RELEASE_NOTES.md
            NOTES_ARGS=(--notes-file dist/RELEASE_NOTES.md)
          else
            NOTES_ARGS=(--generate-notes)
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt \
              --verify-tag --title "MeowMeow File Manager $RELEASE_TAG" "${NOTES_ARGS[@]}"
          else
            gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "MeowMeow File Manager $RELEASE_TAG" "${NOTES_ARGS[@]}"
          fi
