name: Signed Android release

# Secrets are used only by a manual run of the reviewed workflow from main.
# No push, tag or pull-request triggers.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the v0.3.0 GitHub Release (leave false for a signed test APK)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: meowmeow-filemanager-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and persistent encrypted backup
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test -s signing/release-keystore.p12.gpg || {
            echo "::error::Encrypted key is missing. Run Initialize Android release signing and merge the generated encrypted-key PR."
            exit 1
          }
          test -s signing/release-keystore.sha256 || {
            echo "::error::Encrypted backup checksum is missing."
            exit 1
          }
          sha256sum --check --status signing/release-keystore.sha256 || {
            echo "::error::Encrypted backup has changed or is corrupted."
            exit 1
          }
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*$/\1/p' app/build.gradle.kts | head -n 1)"
          CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*$/\1/p' app/build.gradle.kts | head -n 1)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid Android release versionName/versionCode."
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Run unit tests and compile unsigned release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Restore signing key, align, sign and verify APK
        shell: bash
        env:
          MM_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          MM_BACKUP_PASSPHRASE: ${{ secrets.SIGNING_BACKUP_PASSPHRASE }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$MM_STORE_PASSWORD" || -z "$MM_BACKUP_PASSPHRASE" ]]; then
            echo "::error::SIGNING_STORE_PASSWORD or SIGNING_BACKUP_PASSPHRASE is missing."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/meowmeow-filemanager-release.p12"
          ALIGNED="$RUNNER_TEMP/meowmeow-filemanager-unsigned-aligned.apk"
          trap 'rm -f "$KEYSTORE" "$ALIGNED"' EXIT

          exec 3<<<"$MM_BACKUP_PASSPHRASE"
          gpg --batch --yes --pinentry-mode loopback \
            --decrypt --passphrase-fd 3 --output "$KEYSTORE" \
            signing/release-keystore.p12.gpg
          exec 3<&-
          keytool -list -alias meowmeow-release -storetype PKCS12 \
            -keystore "$KEYSTORE" -storepass:env MM_STORE_PASSWORD >/dev/null

          mkdir -p dist
          OUTPUT="$GITHUB_WORKSPACE/dist/MeowMeowFileManager-$RELEASE_TAG.apk"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk "$ALIGNED"
          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-type PKCS12 \
            --ks-key-alias meowmeow-release \
            --ks-pass env:MM_STORE_PASSWORD \
            --key-pass env:MM_STORE_PASSWORD \
            --out "$OUTPUT" "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT"
          "$TOOLS/zipalign" -c -v 4 "$OUTPUT"
          (cd dist && sha256sum "MeowMeowFileManager-$RELEASE_TAG.apk" > SHA256SUMS.txt)
          echo "Signed APK $RELEASE_TAG (version code ${{ steps.version.outputs.versionCode }})"

      - name: Remove private signing files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/meowmeow-filemanager-release.p12" "$RUNNER_TEMP/meowmeow-filemanager-unsigned-aligned.apk"

      - name: Upload directly downloadable signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MeowMeowFileManager-Signed.apk
          path: dist/MeowMeowFileManager-*.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub Release only when explicitly approved
        if: inputs.publish == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Bump versionCode/versionName for a new release."
            exit 1
          fi
          NOTES="docs/releases/$RELEASE_TAG.md"
          if [[ -f "$NOTES" ]]; then
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "MeowMeow File Manager $RELEASE_TAG" "${NOTES_ARGS[@]}"
