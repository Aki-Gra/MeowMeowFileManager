name: Android build

on:
  push:
    branches: [main, feat/android-file-explorer]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, unsigned release and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      # Temporary visibility for existing lint defects before enabling
      # automatic release: always show the complete lint report in logs.
      - name: Diagnose existing Android lint errors
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintDebug --no-daemon
          LINT_STATUS=$?
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [[ -s "$REPORT" ]]; then
            echo "::group::Full Android lint report"
            cat "$REPORT"
            echo "::endgroup::"
          fi
          exit "$LINT_STATUS"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: meowmeow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
